name: Build APK Incu Emak

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q "App Incu Emak.zip" -d project

      - name: Check project structure
        working-directory: project
        run: |
          echo "=== PROJECT FILES ==="
          find . -maxdepth 3 -type f | sort | head -200
          echo "=== ROOT ==="
          ls -la

      - name: Prepare environment file
        working-directory: project
        run: |
          if [ ! -f .env.example ]; then
            touch .env.example
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Check Gradle project
        working-directory: project
        run: |
          echo "=== GRADLE FILES ==="
          find . -maxdepth 2 -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradlew" \) -print
          echo "=== SETTINGS ==="
          if [ -f settings.gradle.kts ]; then
            cat settings.gradle.kts
          elif [ -f settings.gradle ]; then
            cat settings.gradle
          fi

      - name: Build Debug APK
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        working-directory: project
        run: |
          echo "=== APK FILES ==="
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: incu-emak-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
